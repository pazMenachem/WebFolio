    <script>
      // Companion to public/404.html. GitHub Pages cannot serve a real route
      // for a single-page app, so 404.html rewrites /WebFolio/projects into
      // /WebFolio/?/projects and lands here. Turn it back into a path before
      // React Router mounts, so the router sees the route the visitor asked for.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
